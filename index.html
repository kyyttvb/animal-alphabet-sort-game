<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alphabet Animal Sort</title>
<link rel="icon" type="image/png" href="favicon.png">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
    <!-- SortableJS -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>

    <style>
        body {
            /* Brown-Orange polka dot background */
            background-color: #fff8f0;
            background-image: 
                radial-gradient(#fcd3a1 15%, transparent 16%),
                radial-gradient(#fae1c5 15%, transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            font-family: 'Nunito', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .word-tile {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
        }

        /* Клас для елемента під час перетягування */
        .ghost-tile {
            opacity: 0.4;
            transform: scale(0.95);
        }

        /* Заборона виділення тексту на кнопках і заголовках */
        .no-select {
            user-select: none;
        }
    </style>
</head>
<body class="text-gray-800">

    <!-- Header with buttons -->
    <header class="flex flex-col md:flex-row justify-between items-center bg-white/80 backdrop-blur-md p-4 md:px-8 rounded-3xl md:rounded-full shadow-lg m-4 max-w-7xl mx-auto gap-4 border-2 border-orange-100 no-select w-[calc(100%-2rem)]">
        <h1 class="text-2xl md:text-3xl font-black text-orange-600 tracking-wide drop-shadow-sm text-center">🔤 ABC Animal Sort</h1>
        <div class="flex flex-wrap justify-center gap-3">
            <button id="hint-btn" class="px-5 py-2.5 bg-orange-300 hover:bg-orange-400 text-orange-950 font-extrabold rounded-full shadow-md transition-transform transform hover:scale-105 active:scale-95 flex items-center gap-2">
                💡 Hint
            </button>
            <button id="check-btn" class="px-5 py-2.5 bg-orange-500 hover:bg-orange-600 text-white font-extrabold rounded-full shadow-md transition-transform transform hover:scale-105 active:scale-95 flex items-center gap-2">
                ✅ Check
            </button>
            <button id="fs-btn" class="w-11 h-11 flex items-center justify-center bg-amber-200 hover:bg-amber-300 text-amber-900 font-extrabold rounded-full shadow-md transition-transform transform hover:scale-105 active:scale-95 text-lg" title="Fullscreen">
                ⛶
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex flex-col lg:flex-row gap-6 p-4 md:p-6 w-full max-w-7xl mx-auto flex-1 h-full mb-8">
        
        <!-- Word Bank -->
        <section class="flex-1 bg-white/70 backdrop-blur-md rounded-[2rem] p-6 shadow-xl border-4 border-white flex flex-col">
            <h2 class="text-2xl font-extrabold text-orange-800 mb-2 text-center no-select">Word Bank 🏦</h2>
            <p class="text-center text-orange-600/80 mb-4 font-bold text-sm no-select">Drag animals from here</p>
            <div id="bank-area" class="flex-1 flex flex-wrap gap-3 p-4 bg-orange-50/50 rounded-2xl border-2 border-dashed border-orange-300 content-start min-h-[200px] items-start">
                <!-- Cards generated via JS -->
            </div>
        </section>

        <!-- Sorting Zone -->
        <section class="flex-1 bg-white/70 backdrop-blur-md rounded-[2rem] p-6 shadow-xl border-4 border-white flex flex-col">
            <h2 class="text-2xl font-extrabold text-orange-800 mb-2 text-center no-select">Sorting Zone (A ➡️ Z) 🎯</h2>
            <p class="text-center text-orange-600/80 mb-4 font-bold text-sm no-select">Place everyone in their exact spot!</p>
            <div id="sort-area" class="flex-1 flex flex-wrap gap-3 p-4 bg-orange-50/50 rounded-2xl border-2 border-dashed border-orange-400 content-start min-h-[400px] items-start transition-colors duration-300">
                <!-- Cards dropped here -->
            </div>
        </section>

    </main>

    <!-- Hint Modal -->
    <div id="hint-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden items-center justify-center z-50 opacity-0 transition-opacity duration-300 px-4">
        <div class="bg-white p-8 rounded-[2rem] shadow-2xl max-w-lg w-full border-4 border-orange-300 transform scale-95 transition-transform duration-300">
            <h3 class="text-3xl font-extrabold text-center text-orange-600 mb-6 no-select">English Alphabet 🌟</h3>
            <div id="alphabet-grid" class="flex flex-wrap gap-2 justify-center no-select">
                <!-- Letters generated via JS -->
            </div>
            <button id="close-hint" class="mt-8 w-full py-3.5 bg-orange-100 hover:bg-orange-200 text-orange-800 font-extrabold rounded-2xl transition-colors text-lg shadow-sm">Close</button>
        </div>
    </div>

    <!-- Win Modal -->
    <div id="win-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden items-center justify-center z-50 opacity-0 transition-opacity duration-300 px-4">
        <div class="bg-white p-10 rounded-[2rem] shadow-2xl max-w-md w-full border-4 border-orange-500 text-center transform scale-95 transition-transform duration-300">
            <div class="text-7xl mb-6 animate-bounce">🎉</div>
            <h3 class="text-4xl font-extrabold text-orange-600 mb-3 no-select">You Won!</h3>
            <p class="text-orange-800/70 font-bold mb-8 text-lg no-select">All animals are sorted correctly!</p>
            <button id="restart-btn" class="w-full py-4 bg-orange-500 hover:bg-orange-600 text-white font-extrabold text-xl rounded-2xl transition-transform transform hover:scale-105 active:scale-95 shadow-md">Play Again 🔄</button>
        </div>
    </div>

    <script>
        /* ================= ДАНІ ТА СТАН ================= */
        const rawWords = [
            "Ostrich", "squirrel", "parrot", "cheetah", "panda", "penguin", 
            "octopus", "lion", "frog", "polar bear", "whale", "bat", "rhino", 
            "hedgehog", "bee", "armadillo", "giraffe", "monkey", "reindeer", 
            "dolphin", "kangaroo"
        ];

        // Капіталізація першої літери для естетики
        const words = rawWords.map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase());
        
        // Правильний відсортований масив (алфавітний порядок)
        const sortedExpected = [...words].sort((a, b) => a.localeCompare(b));

        const bankArea = document.getElementById('bank-area');
        const sortArea = document.getElementById('sort-area');

        /* ================= ЗВУКИ (Web Audio API) ================= */
        let audioCtx = null;
        let audioInitialized = false;

        function getAudioCtx() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            return audioCtx;
        }

        // Ініціалізація аудіо після першої взаємодії (вимога браузерів)
        window.addEventListener('pointerdown', () => {
            if (!audioInitialized) {
                getAudioCtx();
                audioInitialized = true;
            }
        }, { once: true });

        function playSound(type) {
            if (!audioInitialized) return;
            const ctx = getAudioCtx();
            if (ctx.state === 'suspended') ctx.resume();

            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            
            osc.connect(gain);
            gain.connect(ctx.destination);
            const now = ctx.currentTime;

            if (type === 'drag') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(700, now + 0.1);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'drop') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(700, now);
                osc.frequency.exponentialRampToValueAtTime(400, now + 0.1);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'click') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(800, now);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'error') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(80, now + 0.3);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'win') {
                playNote(523.25, now, 0.1);       // C5
                playNote(659.25, now + 0.15, 0.1); // E5
                playNote(783.99, now + 0.3, 0.1);  // G5
                playNote(1046.50, now + 0.45, 0.4); // C6
            }
        }

        function playNote(freq, time, duration) {
            const ctx = getAudioCtx();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.type = 'sine';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.2, time);
            gain.gain.exponentialRampToValueAtTime(0.01, time + duration);
            osc.start(time);
            osc.stop(time + duration);
        }

        /* ================= ЛОГІКА ІНТЕРФЕЙСУ ================= */
        
        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function initGame() {
            bankArea.innerHTML = '';
            sortArea.innerHTML = '';
            const shuffledWords = shuffle([...words]);

            shuffledWords.forEach((word, idx) => {
                const el = document.createElement('div');
                el.className = `word-tile cursor-grab bg-orange-100 text-orange-950 border-orange-300 px-5 py-2.5 border-2 rounded-2xl shadow-sm font-extrabold text-lg transition-transform hover:-translate-y-1 hover:shadow-md`;
                el.textContent = word;
                el.dataset.word = word;
                bankArea.appendChild(el);
            });
        }

        // Налаштування SortableJS
        const sortableOptions = {
            group: 'shared',
            animation: 200,
            ghostClass: 'ghost-tile',
            easing: "cubic-bezier(0.34, 1.56, 0.64, 1)",
            onStart: () => playSound('drag'),
            onEnd: () => playSound('drop')
        };

        Sortable.create(bankArea, sortableOptions);
        Sortable.create(sortArea, sortableOptions);

        /* ================= ОБРОБНИКИ ПОДІЙ ================= */

        // Fullscreen
        document.getElementById('fs-btn').addEventListener('click', () => {
            playSound('click');
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Error: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        });

        // Hint Modal
        const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
        const hintGrid = document.getElementById('alphabet-grid');
        alphabet.forEach(letter => {
            const span = document.createElement('span');
            span.className = "w-10 h-10 flex items-center justify-center bg-orange-100 text-orange-800 font-black text-xl rounded-xl shadow-sm border-2 border-orange-200";
            span.textContent = letter;
            hintGrid.appendChild(span);
        });

        function openModal(id) {
            const modal = document.getElementById(id);
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            void modal.offsetWidth; // Force reflow
            modal.classList.remove('opacity-0');
            modal.querySelector('.transform').classList.remove('scale-95');
            modal.querySelector('.transform').classList.add('scale-100');
        }

        function closeModal(id) {
            const modal = document.getElementById(id);
            modal.classList.add('opacity-0');
            modal.querySelector('.transform').classList.add('scale-95');
            modal.querySelector('.transform').classList.remove('scale-100');
            setTimeout(() => {
                modal.classList.remove('flex');
                modal.classList.add('hidden');
            }, 300);
        }

        document.getElementById('hint-btn').addEventListener('click', () => {
            playSound('click');
            openModal('hint-modal');
        });
        document.getElementById('close-hint').addEventListener('click', () => {
            playSound('click');
            closeModal('hint-modal');
        });

        // Restart
        document.getElementById('restart-btn').addEventListener('click', () => {
            playSound('click');
            closeModal('win-modal');
            setTimeout(initGame, 300);
        });

        // Перевірка та FLIP Анімація
        document.getElementById('check-btn').addEventListener('click', () => {
            playSound('click');
            const sortedItems = Array.from(sortArea.children);
            
            if (sortedItems.length === 0) {
                playSound('error');
                sortArea.classList.add('bg-orange-200', 'border-orange-500');
                setTimeout(() => sortArea.classList.remove('bg-orange-200', 'border-orange-500'), 500);
                return;
            }

            let correctCount = 0;
            const wrongElements = [];

            // Перевірка абсолютного місця (індекс в масиві Зони Сортування = індекс в expected)
            sortedItems.forEach((el, index) => {
                const word = el.dataset.word;
                if (word !== sortedExpected[index]) {
                    wrongElements.push(el);
                } else {
                    correctCount++;
                    // Theme highlight for correct ones
                    el.classList.add('ring-4', 'ring-orange-500');
                    setTimeout(() => el.classList.remove('ring-4', 'ring-orange-500'), 1200);
                }
            });

            if (wrongElements.length > 0) {
                // Batch FLIP Animation для всіх помилкових елементів
                
                // 1. Зберегти початкові позиції
                const firstRects = new Map();
                wrongElements.forEach(el => {
                    firstRects.set(el, el.getBoundingClientRect());
                    // Видаляємо hover ефекти на час польоту
                    el.classList.remove('hover:-translate-y-1', 'transition-transform');
                });
                
                // 2. Перенести в Банк
                wrongElements.forEach(el => bankArea.appendChild(el));
                
                // 3. Розрахувати дельту та застосувати інверсію
                wrongElements.forEach(el => {
                    const firstRect = firstRects.get(el);
                    const lastRect = el.getBoundingClientRect();
                    
                    const deltaX = firstRect.left - lastRect.left;
                    const deltaY = firstRect.top - lastRect.top;
                    
                    el.style.transform = `translate(${deltaX}px, ${deltaY}px)`;
                    el.style.transition = 'none';
                });
                
                // 4. Запуск анімації (Play)
                void bankArea.offsetWidth; // Force layout
                
                wrongElements.forEach(el => {
                    el.style.transform = 'translate(0, 0)';
                    el.style.transition = 'transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1)';
                    
                    el.addEventListener('transitionend', () => {
                        el.style.transition = '';
                        el.style.transform = '';
                        el.classList.add('hover:-translate-y-1', 'transition-transform');
                    }, { once: true });
                });
                
                setTimeout(() => playSound('error'), 150);

            } else if (correctCount === sortedExpected.length) {
                // Якщо всі 21 слів правильні
                setTimeout(() => {
                    playSound('win');
                    openModal('win-modal');
                }, 400);
            } else {
                // Частково правильні, але не всі виставлені (наприклад тільки 3 слова)
                // Можна дати позитивний звуковий відгук
                playSound('click'); 
            }
        });

        // Запуск гри
        initGame();

    </script>
</body>
</html>
